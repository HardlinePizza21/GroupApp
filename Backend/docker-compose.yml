version: "3.8"

services:
  db:
      image: postgres:15
      restart: always
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: groupsapp
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      #! En produccion cambiar las variables de entorno
      #- .env.production
      - .docker.env
    volumes:
      - .:/app
    depends_on:
      - db
volumes:
  pgdata: