services:
  db:
    image: postgres:16-alpine
    container_name: groupapp_db
    environment:
      POSTGRES_USER: groupapp
      POSTGRES_PASSWORD: groupapp
      POSTGRES_DB: groupapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupapp -d groupapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    container_name: backend
    ports:
      - "3000:3000"
    env_file:
      - ./Backend/.env.example
    environment:
      DATABASE_URL: postgresql://groupapp:groupapp@db:5432/groupapp
      # Sin esto, `npm ci` puede omitir devDependencies y no instalaría el CLI de Prisma.
      NODE_ENV: development
    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules
    working_dir: /app
    # El bind mount tapa node_modules de la imagen; instalamos en el volumen y usamos Prisma local.
    command:
      [
        "sh",
        "-c",
        "npm ci && npx prisma generate && npx prisma migrate deploy && exec node server.js",
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./Frontend
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      NODE_ENV: development
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command:
      ["sh", "-c", "npm ci && exec npm run dev"]
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
