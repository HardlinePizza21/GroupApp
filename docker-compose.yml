services:
  db:
    image: postgres:16-alpine
    container_name: groupapp_db
    environment:
      POSTGRES_USER: groupapp
      POSTGRES_PASSWORD: groupapp
      POSTGRES_DB: groupapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupapp -d groupapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    container_name: backend
    ports:
      - "3000:3000"
    env_file:
      - ./Backend/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:samuel14madrid@database-1.c1ceeukuom6z.us-east-1.rds.amazonaws.com:5432/postgres
      # Sin esto, `npm ci` puede omitir devDependencies y no instalaría el CLI de Prisma.
      NODE_ENV: development
    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules
    working_dir: /app
    # El bind mount tapa node_modules de la imagen; instalamos en el volumen y usamos Prisma local.
    command:
      [
        "sh",
        "-c",
        "npm ci && npx prisma generate && npx prisma migrate deploy && exec node server.js",
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./Frontend
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      NODE_ENV: development
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command:
      ["sh", "-c", "npm ci && exec npm run dev"]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  #!Auth Service
  auth-service:
    build: ./auth
    container_name: auth-service
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://auth:auth@auth-db:5432/auth_db
      JWT_SECRET: dev-jwt-secret-minimo-32-caracteres-cambiar
      JWT_REFRESH_SECRET: dev-refresh-secret-minimo-32-caracteres-cambiar
      NODE_ENV: development
      RABBITMQ_URL: amqp://guest:guest@172.31.28.130:5672
    volumes:
      - ./auth:/app
      - auth_node_modules:/app/node_modules
    working_dir: /app
    command: [
      "sh",
      "-c",
      "npm ci && npx prisma generate && npx prisma migrate deploy && exec node server.js",
    ]
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  
  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432" 
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  #! Groups&Channel Service
  groups-service:
    build: ./groups
    container_name: groups-service
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://groups:groups@groups-db:5432/groups_db
      JWT_SECRET: supersecret
      NODE_ENV: development
      RABBITMQ_URL: amqp://guest:guest@172.31.28.130:5672
    volumes:
      - ./groups:/app
      - groups_node_modules:/app/node_modules
    working_dir: /app
    command: [
      "sh",
      "-c",
      "npm ci && npx prisma generate && npx prisma migrate deploy && exec node server.js",
    ]
    depends_on:
      groups-db:
        condition: service_healthy
    restart: unless-stopped
  
  groups-db:
    image: postgres:16
    container_name: groups-db
    environment:
      POSTGRES_USER: groups
      POSTGRES_PASSWORD: groups
      POSTGRES_DB: groups_db
    ports:
      - "5433:5432" 
    volumes:
      - groups_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groups -d groups_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  #! Messages Service
  messages-service:
    build: ./messages-service
    container_name: messages-service
    ports:
      - "3004:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://messages:messages@messages-db:5432/messages_db
      #!Esta la variable cuando se despliegue en aws
      # DATABASE_URL: prisma+postgres://localhost:51213/?api__c3NsbW9kZT1kaXNhYmxlJmNvbm5lY3Rpb25fbGltaXQ9MSZjb25uZWN0X3RpbWVvdXQ9MCZtYXhfaWRsZV9jb25uZWN0aW9uX2xpZmV0aW1lPTAmcG9vbF90aW1lb3V0PTAmc2luZ2xlX3VzZV9jb25uZWN0aW9ucz10cnVlJnNvY2tldF90aW1lb3V0PTAifQ
      JWT_SECRET: dev-jwt-secret-minimo-32-caracteres-cambiar
      NODE_ENV: development
      RABBITMQ_URL: amqp://guest:guest@172.31.28.130:5672
    volumes:
      - ./messages-service:/app
      - messages_node_modules:/app/node_modules
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "npm ci && npx prisma generate && exec node server.js",
      ]
    depends_on:
      messages-db:
        condition: service_healthy
    restart: unless-stopped

  messages-db:
    image: postgres:16
    container_name: messages-db
    environment:
      POSTGRES_USER: messages
      POSTGRES_PASSWORD: messages
      POSTGRES_DB: messages_db
    ports:
      - "5434:5432"
    volumes:
      - messages_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messages -d messages_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  #! Notifications Service
  notifications-service:
    build: ./notifications
    container_name: notifications-service
    ports:
      - "3003:3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://guest:guest@172.31.28.130:5672
      JWT_SECRET: dev-jwt-secret-minimo-32-caracteres-cambiar
      NODE_ENV: development
    volumes:
      - ./notifications:/app
      - notifications_node_modules:/app/node_modules
    working_dir: /app
    command: ["sh", "-c", "npm ci && exec npm start"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
  auth_node_modules:
  auth_pgdata:
  groups_node_modules:
  groups_pgdata:
  messages_node_modules:
  messages_pgdata:
  notifications_node_modules:
